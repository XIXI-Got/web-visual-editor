<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>diag2</title>
<style>body{margin:0}iframe{width:1400px;height:860px;border:0}pre{position:fixed;right:0;top:0;width:520px;max-height:100vh;overflow:auto;background:#fff;border-left:1px solid #000;padding:10px;font:11px ui-monospace,monospace;white-space:pre-wrap;margin:0;z-index:9}</style>
</head><body>
<iframe id="f" src="/?ve=1"></iframe>
<pre id="out">…</pre>
<script>
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
document.getElementById("f").addEventListener("load", async () => {
  const f=document.getElementById("f"), w=f.contentWindow, d=f.contentDocument;
  const info={};
  try{
    await sleep(900);
    const V=w.__VE__;
    if(!V.S.on) V.setMode();
    const h1=d.querySelector("h1");
    info.veId=h1.getAttribute("data-ve-id");
    V.select(h1);
    await sleep(100);
    const key=V.elementKey(h1);
    info.key=key;
    info.selector=V.keyToSelector(key);
    info.querySelectorMatch=d.querySelector(info.selector)===h1;
    V.mutate(key, e=>{ e.style=e.style||{}; e.style["font-size"]="130px"; });
    await sleep(400);
    info.computedFont=w.getComputedStyle(h1).fontSize;
    const tag=d.getElementById("__ve_style");
    info.hasStyleTag=!!tag;
    info.sheetText=(tag?tag.textContent:"").slice(0,400);
    info.pending=JSON.stringify(V.S.pending);
    info.debugKeys=Object.keys(w.__VE_DEBUG__||{});
    if(w.__VE_DEBUG__){
      try{ info.styleToCssDirect=String(w.__VE_DEBUG__.styleToCss(w.__VE_DEBUG__.effectiveEntries())).slice(0,300); }catch(e){ info.styleToCssError=String(e&&e.stack||e); }
      try{ w.__VE_DEBUG__.refreshStylesheet(); info.afterManual=(d.getElementById("__ve_style")||{}).textContent; }catch(e){ info.refreshError=String(e&&e.stack||e); }
    }
    // 尝试直接读 CSS 规则
    if(tag&&tag.sheet){ info.ruleCount=tag.sheet.cssRules.length; info.firstRule=tag.sheet.cssRules[0]?tag.sheet.cssRules[0].cssText:""; }
    const m=d.createElement("div"); m.textContent="匹配测试"; d.body.appendChild(m);
    info.errors=(w.__VE_ERRORS__||[]).slice(0,5);
  }catch(err){ info.fatal=String(err&&err.stack||err); }
  document.getElementById("out").textContent=JSON.stringify(info,null,1);
});
</script>
<script defer src="ve-applied.js" data-ve-applied="1"></script>
</body></html>
