<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风格对比 · 原版 / 新版</title>
<style>
  :root{--ink:#111;--paper:#FBFBFB;--line:rgba(0,0,0,.16);--soft:#E9E7E2;--split:50%}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--soft);color:var(--ink);font-family:"Inter Tight","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}

  /* 新风格生成中：只遮住“新版”那一半，原版仍可对照 */
  .pending{position:absolute;left:var(--split);right:0;top:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper);color:#111}
  .pending[hidden]{display:none}
  body.single.show-after .pending{left:0;right:0}
  body.single.show-before .pending{display:none!important}
  .pending-dots{display:flex;align-items:center;gap:7px;height:20px}
  .pending-dots i{width:7px;height:7px;border-radius:50%;background:#111;animation:ve-dot 1.1s infinite ease-in-out}
  .pending-dots i:nth-child(2){animation-delay:.16s}.pending-dots i:nth-child(3){animation-delay:.32s}
  .pending-text{font:600 13px/1.4 "Inter Tight","PingFang SC","Noto Sans SC",sans-serif;letter-spacing:.08em;color:rgba(0,0,0,.65)}
  @keyframes ve-dot{0%,80%,100%{opacity:.18;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

  .bar{height:58px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:10}
  .brand{font-weight:700;font-size:13px;letter-spacing:-.01em;margin-right:8px;white-space:nowrap}
  .brand span{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500;font-size:10px;letter-spacing:.14em;color:rgba(0,0,0,.52);margin-left:8px}
  .seg{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:#fff}
  .seg button{border:0;background:transparent;color:rgba(0,0,0,.62);font:600 12px/1 inherit;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:#000}
  .seg button.on{background:#111;color:#fff}
  .spacer{flex:1}
  .hint{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:rgba(0,0,0,.48);white-space:nowrap}
  .stage{position:absolute;inset:58px 0 0;background:#fff}
  iframe{position:absolute;top:0;bottom:0;height:100%;border:0;background:#fff}
  #before{left:0;width:100%}
  #after{left:0;width:100%;display:none}
  body.single.show-after #before{display:none}
  body.single.show-before #after{display:none}
  body.single.show-after #after{display:block}
  /* 同一个整页窗口，用裁切而不是缩放窗口：左右两边始终同宽、同滚动位置 */
  body.split #before{width:100%;clip-path:inset(0 calc(100% - var(--split)) 0 0)}
  body.split #after{display:block;left:0;width:100%;clip-path:inset(0 0 0 var(--split))}
  .divider{display:none;position:absolute;top:0;bottom:0;left:var(--split);width:12px;margin-left:-6px;z-index:6;cursor:col-resize;touch-action:none}
  .divider:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#111;opacity:.75;transition:opacity .2s}
  .divider:hover:before,.divider.drag:before{opacity:1}
  .divider:after{content:"↔";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font:600 14px/1 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 4px 14px rgba(0,0,0,.24)}
  body.split .divider{display:block}
  .tag{position:absolute;bottom:12px;z-index:4;font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:#fff;background:#111;border-radius:999px;padding:7px 10px;pointer-events:none}
  .tag-before{left:12px}
  .tag-after{right:12px;display:none}
  body.split .tag-after{display:block}
  body.single.show-after .tag-before{display:none}
  body.single.show-after .tag-after{display:block;left:12px;right:auto;bottom:12px}

  /* 预览实例端口变了 / 服务已关闭：不再显示浏览器的「拒绝连接」白屏，给一个可操作的重连提示 */
  .offline{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--paper);color:var(--ink);text-align:center;padding:24px}
  .offline[hidden]{display:none}
  .offline-title{font:700 15px/1.3 "Inter Tight","PingFang SC",sans-serif;letter-spacing:-.01em}
  .offline-text{font:400 12.5px/1.7 "Inter Tight","PingFang SC",sans-serif;color:rgba(0,0,0,.55);max-width:52ch}
  .offline button{border:0;background:#111;color:#fff;font:600 12px/1 inherit;padding:10px 16px;border-radius:999px;cursor:pointer}
  .offline button:hover{opacity:.86}
  @media(max-width:620px){.brand span{display:none}.hint{display:none}.bar{gap:6px;padding:0 10px}.seg button{padding:7px 9px;font-size:11px}}
</style>
</head>
<body class="split">
  <div class="bar">
    <div class="brand">风格对比<span>ORIGINAL / STYLED</span></div>
    <div class="seg" role="group" aria-label="预览模式">
      <button type="button" id="btnBefore">原版</button>
      <button type="button" id="btnAfter">新版</button>
      <button type="button" id="btnSplit" class="on">左右对比</button>
    </div>
    <div class="spacer"></div>
    <div class="hint">拖动中间分割线对比 · 按钮切换单页预览</div>
  </div>
  <div class="stage" id="stage">
    <iframe id="before" title="原版页面"></iframe>
    <iframe id="after" title="新版页面"></iframe>
    <div class="divider" id="divider" role="separator" aria-label="拖动调整左右比例"></div>
    <div class="pending" id="pending" hidden>
      <div class="pending-dots"><i></i><i></i><i></i></div>
      <div class="pending-text">风格生成中…</div>
    </div>
    <div class="offline" id="offline" hidden>
    <div class="offline-title">预览服务已关闭</div>
    <div class="offline-text" id="offlineText">项目预览实例被重新打开了（端口变了），正在尝试重新连接…</div>
    <button type="button" id="offlineRetry">重新连接</button>
  </div>
  <div class="tag tag-before">原版 · BEFORE</div>
    <div class="tag tag-after">新版 · AFTER</div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const beforeSrc = params.get('before') || 'muse.original.html';
  const afterSrc = params.get('after') || 'muse.html';
  const before = document.getElementById('before');
  const after = document.getElementById('after');
  const divider = document.getElementById('divider');
  const stage = document.getElementById('stage');
  const btnBefore = document.getElementById('btnBefore');
  const btnAfter = document.getElementById('btnAfter');
  const btnSplit = document.getElementById('btnSplit');
  before.src = beforeSrc;
  after.src = afterSrc;
  let split = 50;
  let drag = false;
  function setMode(mode, side) {
    document.body.classList.toggle('split', mode === 'split');
    document.body.classList.toggle('single', mode !== 'split');
    document.body.classList.remove('show-before', 'show-after');
    if (mode !== 'split') document.body.classList.add(side === 'before' ? 'show-before' : 'show-after');
    btnBefore.classList.toggle('on', mode !== 'split' && side === 'before');
    btnAfter.classList.toggle('on', mode !== 'split' && side === 'after');
    btnSplit.classList.toggle('on', mode === 'split');
  }
  function setSplit(pct) {
    split = Math.max(15, Math.min(85, pct));
    document.documentElement.style.setProperty('--split', split + '%');
  }
  btnBefore.addEventListener('click', () => setMode('single', 'before'));
  btnAfter.addEventListener('click', () => setMode('single', 'after'));
  btnSplit.addEventListener('click', () => setMode('split'));
  divider.addEventListener('pointerdown', (e) => {
    drag = true; divider.classList.add('drag');
    try { divider.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const r = stage.getBoundingClientRect();
    setSplit(((e.clientX - r.left) / r.width) * 100);
  });
  window.addEventListener('pointerup', () => { drag = false; divider.classList.remove('drag'); });
  // 两个 iframe 始终显示同一个页面位置：滚其中一个，另一个同步滚
  let syncing = false;
  function bindScroll(src, dst) {
    try {
      src.addEventListener("scroll", () => {
        if (syncing) return;
        syncing = true;
        try { dst.scrollTo(src.scrollX, src.scrollY); } catch {}
        requestAnimationFrame(() => { syncing = false; });
      }, { passive: true });
    } catch {}
  }
  function wireScrollSync() {
    try {
      const a = before.contentWindow;
      const b = after.contentWindow;
      if (a && b) { bindScroll(a, b); bindScroll(b, a); }
    } catch {}
  }
  before.addEventListener("load", wireScrollSync);
  after.addEventListener("load", wireScrollSync);
  // 由工作台「应用并打开风格对比」打开时，等待新版本写回后再揭开右侧
  const pending = params.get("pending") === "1";
  const pendingEl = document.getElementById("pending");
  if (pending && pendingEl) {
    pendingEl.hidden = false;
    const sigOf = async (url) => {
      try {
        const res = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        let h = 0;
        for (let i = 0; i < text.length; i += 97) h = (h * 31 + text.charCodeAt(i)) | 0;
        return text.length + ":" + h;
      } catch { return ""; }
    };
    const base = new URL(afterSrc, location.href);
    const appliedUrl = new URL("ve-applied.js", base).toString();
    let baseline = null;
    const check = async () => {
      const s1 = await sigOf(base.toString());
      const s2 = await sigOf(appliedUrl);
      const now = s1 + "|" + s2;
      if (baseline === null) { baseline = now; }
      else if (now !== baseline) {
        pendingEl.hidden = true;
        after.src = afterSrc + (afterSrc.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
        return;
      }
      setTimeout(check, 2000);
    };
    setTimeout(check, 1200);
  }

  // ── 自愈：项目预览实例被重新打开（端口变了 / DSH 重启）时，对比页的 iframe 会 ERR_CONNECTION_REFUSED。
  // 这里通过工作台传进来的 api + dir 找到当前端口，整页跳到新的对比地址；找不到就显示可操作的提示。
  const apiBase = (params.get('api') || '').replace(/\/+$/, '');
  const projDir = params.get('dir') || '';
  const offlineEl = document.getElementById('offline');
  const offlineText = document.getElementById('offlineText');
  let recovering = 0;
  const frameOk = (f) => { try { return Boolean(f.contentDocument && f.contentDocument.location); } catch { return false; } };
  function showOffline(msg) { if (!offlineEl) return; offlineEl.hidden = false; if (offlineText && msg) offlineText.textContent = msg; }
  async function recoverFromDeadPort() {
    if (!apiBase || !projDir || recovering >= 2) {
      showOffline('预览服务已关闭：回到工作台「应用并打开风格对比」重新打开这个页面。');
      return;
    }
    recovering += 1;
    showOffline('预览服务端口变了，正在重新连接…');
    try {
      const res = await fetch(apiBase + '/ve/plugin/projects', { cache: 'no-store' });
      const data = await res.json();
      const hit = (data.projects || []).find((x) => String(x.dir || '').toLowerCase() === projDir.toLowerCase());
      if (!hit || !hit.url) { showOffline('找不到项目预览实例：回到工作台重新打开「风格对比」。'); return; }
      const next = new URL('style-compare.html', hit.url);
      params.forEach((v, k) => { if (k !== 't') next.searchParams.set(k, v); });
      if (next.host === location.host) { showOffline('预览服务还没起来：点「重新连接」再试一次。'); return; }
      location.replace(next.toString());
    } catch (e) {
      showOffline('重新连接失败：' + String((e && e.message) || e));
    }
  }
  function checkFrames() { if (!frameOk(before) || !frameOk(after)) recoverFromDeadPort(); }
  const retryBtn = document.getElementById('offlineRetry');
  if (retryBtn) retryBtn.addEventListener('click', () => {
    recovering = 0;
    if (offlineEl) offlineEl.hidden = true;
    before.src = beforeSrc; after.src = afterSrc;
    setTimeout(checkFrames, 4500);
  });
  setTimeout(checkFrames, 5000);
  window.addEventListener('load', () => setTimeout(checkFrames, 1200));

  setMode('split');
  setSplit(50);
</script>
</body>
</html>
