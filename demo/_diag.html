<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>diag</title>
<style>
  body{margin:0;font:12px ui-monospace,monospace}
  iframe{width:1420px;height:880px;border:0;display:block}
  pre{position:fixed;right:0;top:0;max-width:520px;max-height:100vh;overflow:auto;background:#fff;border-left:1px solid #000;padding:8px;z-index:9;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<iframe id="f" src="/?ve=1&sel=h1"></iframe>
<pre id="out">waiting…</pre>
<script>
function run() {
  const f = document.getElementById("f");
  const d = f.contentDocument;
  const w = f.contentWindow;
  const host = d.getElementById("__ve_host");
  const sr = host && host.shadowRoot;
  const q = (sel) => (sr ? sr.querySelector(sel) : null);
  const info = {
    errors: (w.__VE_ERRORS__ || []).slice(0, 8),
    hasHost: Boolean(host),
    hasShadow: Boolean(sr),
    panelHidden: q(".ve-panel") ? q(".ve-panel").hidden : "no-panel",
    panelH: q(".ve-panel") ? Math.round(q(".ve-panel").getBoundingClientRect().height) : -1,
    bodyLen: q(".ve-body") ? q(".ve-body").innerHTML.length : -1,
    bodyH: q(".ve-body") ? Math.round(q(".ve-body").getBoundingClientRect().height) : -1,
    panes: sr ? [...sr.querySelectorAll("[data-pane]")].map((p) => p.dataset.pane + ":" + (p.hidden ? "hidden" : "show")) : [],
    rows: q("[data-pane=text] .ve-row") ? q("[data-pane=text] .ve-row").length : -1,
    outline: q("#outline") ? q("#outline").style.display + " " + q("#outline").style.width : "none",
    selected: w.__VE__ && w.__VE__.S.selected ? w.__VE__.S.selected.tagName : "none",
    grid: q("#grid") ? q("#grid").style.display : "none",
    token: (w.__VE_BOOT__ || {}).token ? "yes" : "no",
    overrides: w.__VE__ ? Object.keys(w.__VE__.S.overrides).length : -1,
    pending: w.__VE__ ? Object.keys(w.__VE__.S.pending).length : -1,
  };
  document.getElementById("out").textContent = JSON.stringify(info, null, 2);
}
const f = document.getElementById("f");
f.addEventListener("load", () => setTimeout(run, 900));
setTimeout(run, 1600);
</script>

<script defer src="ve-applied.js" data-ve-applied="1"></script>
</body>
</html>
