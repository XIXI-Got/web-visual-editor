<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题 + 图片 + 按钮 · DEMO 蓝白</title>
<style>
  /* ===== DEMO 蓝白 tokens（硬约束） ===== */
  :root{
    --paper:#FFFFFF;
    --soft:#F5F8FD;
    --sky:#EAF1FF;
    --ink:#0B1220;
    --muted:#5B667A;
    --dim:#8B95A8;
    --blue:#2563EB;
    --blue2:#4D6BFE;
    --line:#E6EBF4;
    --font-sans:"Inter","Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    --font-mono:Consolas,"SFMono-Regular",monospace;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-pill:999px;
    --shadow-card:0 24px 60px rgba(20,40,90,.12);
    --shadow-float:0 10px 26px rgba(20,40,90,.14);
    --motion-ease:cubic-bezier(.16,.84,.3,1);
    --motion-fast:160ms;
    --motion-base:280ms;
    --design-w:1440;
    --u:clamp(.45px,calc(100vw / var(--design-w)),1px);
  }
  *{box-sizing:border-box}
  body{min-height:0;padding-bottom:0;overflow:hidden}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);overflow-x:clip}
  body{background:linear-gradient(180deg,var(--paper) 0%,var(--soft) 100%)}
  .preview-wrap{width:min(1120px,calc(100% - 40px));height:calc(400px - 56px);margin:0 auto;display:flex;align-items:center;overflow:visible}
  /* 左右布局：左文案/按钮，右图片 */
  .preview-block{width:100%;display:grid;transform:scale(.88) translateY(-22px);transform-origin:center;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:calc(64 * var(--u));align-items:center}
  .preview-copy{min-width:0;max-width:470px;height:200px;display:flex;flex-direction:column;justify-content:center;margin-left:30px}
  .preview-eyebrow{margin:0 0 calc(14 * var(--u));font:500 max(10px,calc(10 * var(--u)))/1.4 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
  .preview-title{margin:0;font-family:var(--font-sans);font-weight:800;font-size:clamp(30px,4vw,48px);line-height:1.04;letter-spacing:-.04em;color:var(--ink)}
  .preview-lead{margin:calc(16 * var(--u)) 0 0;max-width:46ch;color:var(--muted);font-size:14px;line-height:1.65;height:calc(2 * 1.65em);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .preview-actions{display:flex;align-items:center;gap:calc(14 * var(--u));flex-wrap:wrap;margin-top:22px}
  .preview-btn{display:inline-flex;align-items:center;justify-content:center;min-height:calc(44 * var(--u));padding:0 calc(22 * var(--u));border-radius:var(--radius-pill);background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:max(12px,calc(13 * var(--u)));box-shadow:var(--shadow-float);transition:transform var(--motion-fast) var(--motion-ease),background var(--motion-fast) var(--motion-ease)}
  .preview-btn:hover{transform:translateY(-1px);background:var(--blue2)}
  .preview-meta{color:var(--dim);font-size:max(9px,calc(10 * var(--u)));font-family:var(--font-mono);letter-spacing:.08em}
  .preview-figure{position:relative;margin:0;width:100%;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;max-height:calc(420 * var(--u));background:var(--sky);border:1px solid var(--line);box-shadow:var(--shadow-card)}
  .preview-figure img{display:block;width:100%;height:100%;object-fit:cover}
  @media (max-width:760px){
    .preview-wrap{width:calc(100% - calc(28 * var(--u)));height:auto;min-height:0;margin:calc(36 * var(--u)) auto;display:block;overflow:visible}
    .preview-block{grid-template-columns:1fr;gap:calc(24 * var(--u))}
    .preview-copy{max-width:none;margin-left:0}
    .preview-title{font-size:max(28px,calc(48 * var(--u)))}
    .preview-figure{aspect-ratio:16/9}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .tpl-nav{position:relative;z-index:5;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
  .tpl-nav-inner{width:min(1120px,calc(100% - 40px));height:56px;margin:0 auto;display:flex;align-items:center;gap:26px}
  .tpl-nav-brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font:600 10px/1 var(--font-sans);letter-spacing:.15em;white-space:nowrap}
  .tpl-nav-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--blue);color:#fff;font:700 11px/1 var(--font-sans);letter-spacing:0}
  .tpl-nav-links{display:flex;align-items:center;gap:22px;margin-left:auto}
  .tpl-nav-links a{color:var(--muted);text-decoration:none;font:500 11px/1 var(--font-sans);padding:6px 0;white-space:nowrap}
  .tpl-nav-links a.is-active{color:var(--ink)}
  .tpl-nav-cta{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 16px;border-radius:var(--radius-pill);background:var(--blue);color:#fff;text-decoration:none;font:600 10.5px/1 var(--font-sans);white-space:nowrap}
  @media (max-width:640px){.tpl-nav-links a:not(.is-active){display:none}.tpl-nav-inner{gap:14px}.tpl-nav-brand span:last-child{display:none}.tpl-nav-cta{padding:0 12px}}
</style>
</head>
<body>

  <header class="tpl-nav">
    <div class="tpl-nav-inner">
      <a class="tpl-nav-brand" href="#"><span class="tpl-nav-mark">S</span><span>STYLE TEMPLATE</span></a>
      <nav class="tpl-nav-links" aria-label="主导航">
        <a class="is-active" href="#preview">预览</a><a href="#styles">风格库</a><a href="#templates">模板</a><a href="#about">关于</a>
      </nav>
      <a class="tpl-nav-cta" href="#start">使用模板</a>
    </div>
  </header>
  <main class="preview-wrap">
    <!-- 复制范围：从 <section> 到 </section>；替换图片和文案即可 -->
    <section class="preview-block" aria-labelledby="preview-title">
      <div class="preview-copy">
        <p class="preview-eyebrow">FEATURE / 01</p>
        <h2 class="preview-title" id="preview-title">让页面交付更干净</h2>
        <p class="preview-lead">左侧标题、说明和按钮，右侧一张完整的页面预览；白纸、浅灰蓝分区和唯一蓝色强调，让最后一步交付更安静。</p>
        <div class="preview-actions">
          <a class="preview-btn" href="#">了解详情</a>
          <span class="preview-meta">TITLE / IMAGE / BUTTON</span>
        </div>
      </div>

      <figure class="preview-figure">
        <img src="preview-blue-white.png" alt="预览图片：蓝白风格页面拼贴" loading="lazy">
      </figure>
    </section>
  </main>
</body>
</html>
