<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题 + 图片 + 按钮 · 内容模板块</title>
<style>
  /* 可复制到项目里的独立模板块；只改 :root 的 4 个变量就能换风格 */
  :root{
    --bg:#FBFBFB;
    --ink:#111111;
    --muted:rgba(17,17,17,.62);
    --accent:#111111;
    --radius:24px;
    --font:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --display:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:clip}
  .preview-wrap{width:min(940px,calc(100% - 40px));margin:clamp(28px,6vw,72px) auto}
  .preview-block{display:flex;flex-direction:column;gap:clamp(20px,3vw,32px)}
  .preview-head{max-width:760px}
  .preview-eyebrow{margin:0 0 12px;font:500 10px/1.4 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .preview-title{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,62px);line-height:1.06;letter-spacing:-.035em}
  .preview-lead{margin:14px 0 0;max-width:56ch;color:var(--muted);font-size:clamp(13px,1.5vw,16px);line-height:1.75}
  .preview-figure{position:relative;margin:0;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#F1EEE8;box-shadow:0 18px 45px rgba(17,17,17,.08)}
  .preview-figure img{display:block;width:100%;height:100%;object-fit:cover}
  .preview-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .preview-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px;transition:transform .2s ease,opacity .2s ease}
  .preview-btn:hover{transform:translateY(-1px);opacity:.86}
  .preview-meta{color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
  @media (max-width:560px){.preview-wrap{width:calc(100% - 28px)}.preview-figure{aspect-ratio:4/3}.preview-actions{align-items:flex-start}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <main class="preview-wrap">
    <!-- 复制范围：从 <section> 到 </section>，图片换成自己的资源即可 -->
    <section class="preview-block" aria-labelledby="preview-title">
      <header class="preview-head">
        <p class="preview-eyebrow">FEATURE / 01</p>
        <h2 class="preview-title" id="preview-title">让内容更有秩序</h2>
        <p class="preview-lead">标题、图片和按钮放在同一个模板块里；把留白、圆角和强调色控制在少数几个 token 上，换风格时只改这里的变量。</p>
      </header>

      <figure class="preview-figure">
        <img src="preview-placeholder.svg" alt="预览图片：抽象留白与点阵" loading="lazy">
      </figure>

      <div class="preview-actions">
        <a class="preview-btn" href="#">了解详情</a>
        <span class="preview-meta">TITLE / IMAGE / BUTTON</span>
      </div>
    </section>
  </main>
</body>
</html>
