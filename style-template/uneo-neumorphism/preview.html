<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNEO 暖石拟物 · 内容块</title>
<style>
  :root{
    --canvas:#F3EFE9;--card:#F6F3EE;--elevated:#F8F6F2;--recessed:#EDE8E0;
    --shadowDark:#E2DDD4;--shadowDeep:#D5CFC4;--shadowLight:#FFFFFF;
    --espresso:#33281E;--bronze:#8C6F52;--bronzeSoft:#B69D82;
    --textSecondary:#756B61;--textMuted:#A39A90;
    --font-display:"Source Han Serif SC","Noto Serif SC","Songti SC",STSong,Georgia,serif;
    --font-sans:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    --u:clamp(.45px,calc(100vw / 1440),1px);--r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:32px;--r-full:999px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--canvas);color:var(--espresso);font-family:var(--font-sans);overflow-x:clip}
  body{background-image:radial-gradient(rgba(51,40,30,.022) 1px,transparent 0);background-size:4px 4px;min-height:0;padding-bottom:0;overflow:hidden}
  .preview-wrap{width:min(1120px,calc(100% - 40px));height:calc(400px - 56px);margin:0 auto;display:flex;align-items:center;overflow:visible}
  .preview-block{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(28px,5vw,64px);align-items:center}
  .preview-copy{min-width:0;max-width:470px;height:200px;display:flex;flex-direction:column;justify-content:center;margin-left:30px}
  .preview-eyebrow{margin:0 0 14px;font:500 10px/1.4 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
  .preview-title{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4vw,48px);line-height:1.04;letter-spacing:-.02em;color:var(--espresso)}
  .preview-lead{margin:16px 0 0;max-width:46ch;color:var(--textSecondary);font-size:14px;line-height:1.65;height:calc(2 * 1.65em);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .preview-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
  .preview-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:var(--r-full);background:linear-gradient(145deg,#3D3024,#2B2118);color:#FAF8F5;text-decoration:none;font-weight:500;font-size:13px;box-shadow:7px 9px 18px rgba(51,40,30,.26),-4px -4px 10px #FFFFFF;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s cubic-bezier(.22,1,.36,1)}
  .preview-btn:hover{transform:translateY(-1px);box-shadow:9px 11px 22px rgba(51,40,30,.32),-5px -5px 12px #FFFFFF}
  .preview-meta{color:var(--textMuted);font-size:10px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
  .preview-figure{position:relative;margin:0;width:100%;aspect-ratio:16/9;max-height:calc(420 * var(--u));border-radius:var(--r-xl);overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.78);box-shadow:16px 16px 34px var(--shadowDark),-16px -16px 34px var(--shadowLight)}
  .preview-figure img{display:block;width:100%;height:100%;object-fit:cover}

  /* UNEO 拟物组件：旋钮、凹槽、双光源 */
  .neo-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0;width:100%;height:100%;aspect-ratio:auto;max-height:none;background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible}
  .neo-dial{position:relative;width:min(210px,62%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
  .neo-ring,.neo-arc{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .neo-ring{background:repeating-conic-gradient(from 210deg,#D5CFC4 0deg 1.2deg,transparent 1.2deg 9deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));opacity:.9}
  .neo-arc{background:conic-gradient(from 205deg,transparent 0 35deg,#8C6F52 35deg 148deg,transparent 148deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
  .neo-well{width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#E8E2D9,#F5F2EC);border:1px solid rgba(255,255,255,.65);box-shadow:inset 10px 10px 22px #D5CFC4,inset -10px -10px 22px #FFFFFF,6px 6px 16px rgba(226,221,212,.6)}
  .neo-cap{width:72%;aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 30% 28%,#FCFBF9 0%,#F4F0E8 58%,#E7E1D6 100%);border:1px solid rgba(255,255,255,.85);box-shadow:12px 14px 26px rgba(182,173,160,.65),-8px -8px 18px rgba(255,255,255,.95),inset 1.5px 1.5px 3px rgba(255,255,255,.9),inset -2px -2px 5px rgba(213,207,196,.6);transform:rotate(35deg)}
  .neo-notch{position:absolute;right:16%;top:50%;width:4px;height:16px;border-radius:999px;background:linear-gradient(90deg,#CFC8BC,#FAF8F5);box-shadow:inset 1px 1px 2px rgba(140,111,82,.45),1px 1px 2px rgba(255,255,255,.9);transform:translateY(-50%)}
  .neo-readout{position:absolute;top:-8px;right:-2px;padding:4px 8px;border-radius:999px;background:#F6F3EE;border:1px solid rgba(226,221,212,.55);box-shadow:3px 3px 8px rgba(226,221,212,.75),-3px -3px 8px rgba(255,255,255,.9);color:#8C6F52;font:500 9px/1 var(--font-sans);white-space:nowrap}
  .neo-modes{display:flex;align-items:center;gap:44px;margin-top:-6px;z-index:1}
  .neo-mode{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#F9F7F4,#EFECE6);border:1px solid rgba(255,255,255,.78);box-shadow:6px 6px 14px #E2DDD4,-6px -6px 14px #FFFFFF;color:#756B61;font-size:14px}
  .neo-mode.is-on{color:#33281E;box-shadow:inset 4px 4px 9px #E2DDD4,inset -4px -4px 9px #FFFFFF}
  .neo-caption{font:500 8px/1 var(--font-sans);letter-spacing:.14em;color:#A39A90;white-space:nowrap}
  .preview-figure.neo-stage img{display:none}
  @media (max-width:760px){.preview-wrap{width:calc(100% - 28px);height:auto;min-height:0;margin:28px auto;display:block;overflow:visible}.preview-block{grid-template-columns:1fr;gap:24px}.preview-copy{max-width:none}.preview-figure{max-height:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .tpl-nav{position:relative;z-index:5;background:linear-gradient(145deg,#F8F6F2,#F3EFE9);border-bottom:1px solid rgba(226,221,212,.72);box-shadow:0 6px 16px rgba(226,221,212,.55),inset 0 1px 0 rgba(255,255,255,.82)}
  .tpl-nav-inner{position:relative;width:min(1120px,calc(100% - 40px));height:56px;margin:0 auto;display:flex;align-items:center;gap:26px}
  .tpl-nav-brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font:600 10px/1 var(--font-sans);letter-spacing:.15em;white-space:nowrap}
  .tpl-nav-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--elevated);color:var(--espresso);font:700 11px/1;box-shadow:3px 3px 8px var(--shadowDark),-3px -3px 8px var(--shadowLight) var(--font-sans);letter-spacing:0}
  .tpl-nav-links{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px;margin-left:0}
  .tpl-nav-cta:hover{transform:translateY(-1px);box-shadow:7px 8px 16px rgba(51,40,30,.30),-4px -4px 10px var(--shadowLight)}
  .tpl-nav-links a{color:var(--muted);text-decoration:none;font:500 11px/1 var(--font-sans);padding:6px 10px;border-radius:999px;white-space:nowrap;transition:color .18s ease,box-shadow .18s ease,background .18s ease}
  .tpl-nav-links a.is-active{color:var(--espresso);background:linear-gradient(145deg,#EDE8E0,#F8F6F2);box-shadow:inset 3px 3px 6px #E2DDD4,inset -3px -3px 6px #FFFFFF}
  .tpl-nav-cta{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 16px;border-radius:var(--radius-pill);background:linear-gradient(145deg,#3D3024,#2B2118);color:#FAF8F5;text-decoration:none;font:500 10.5px/1 var(--font-sans);border:1px solid rgba(255,255,255,.10);box-shadow:5px 6px 12px rgba(51,40,30,.24),-3px -3px 8px var(--shadowLight);white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s cubic-bezier(.22,1,.36,1)}
  @media (max-width:900px){.tpl-nav-links{position:static;transform:none;margin-left:auto}} @media (max-width:640px){.tpl-nav-links a:not(.is-active){display:none}.tpl-nav-inner{gap:14px}.tpl-nav-brand span:last-child{display:none}.tpl-nav-cta{padding:0 12px}}
</style>
</head>
<body>

  <header class="tpl-nav">
    <div class="tpl-nav-inner">
      <a class="tpl-nav-brand" href="#"><span class="tpl-nav-mark">S</span><span>STYLE TEMPLATE</span></a>
      <nav class="tpl-nav-links" aria-label="主导航">
        <a class="is-active" href="#preview">预览</a><a href="#styles">风格库</a><a href="#templates">模板</a><a href="#about">关于</a>
      </nav>
      <a class="tpl-nav-cta" href="#start">使用模板</a>
    </div>
  </header>
  <main class="preview-wrap">
    <section class="preview-block" aria-labelledby="preview-title">
      <div class="preview-copy">
        <p class="preview-eyebrow">UNEO / WARM STONE</p>
        <h2 class="preview-title" id="preview-title">让温度回到界面里</h2>
        <p class="preview-lead">暖石纸面、深咖啡文字与古铜细节，用双侧光源把按钮、卡片和旋钮做成可按的实体；不是扁平的色块。</p>
        <div class="preview-actions">
          <a class="preview-btn" href="#">体验组件</a>
          <span class="preview-meta">TITLE / IMAGE / BUTTON</span>
        </div>
      </div>
      <figure class="preview-figure neo-stage" aria-label="UNEO 拟物旋钮组件">
        <div class="neo-dial">
          <span class="neo-ring" aria-hidden="true"></span>
          <span class="neo-arc" aria-hidden="true"></span>
          <div class="neo-well">
            <div class="neo-cap"><span class="neo-notch"></span></div>
          </div>
          <span class="neo-readout">Brightness · 64%</span>
        </div>
        <div class="neo-modes" aria-hidden="true">
          <span class="neo-mode is-on">☼</span>
          <span class="neo-mode">◉</span>
        </div>
        <figcaption class="neo-caption">TACTILE ROTARY / 触觉旋钮</figcaption>
      </figure>
    </section>
  </main>



<style id="ve-applied-style" data-ve-applied-style="1">

html > body > main.preview-wrap > section.preview-block > figure.preview-figure.neo-stage{width:17.813vw !important;height:18.41vh !important;max-width:100% !important;box-sizing:border-box !important;border-radius:99px 99px 99px 99px !important;}
html > body > main.preview-wrap > section.preview-block > figure.preview-figure.neo-stage > div.neo-dial:nth-of-type(1){width:10.313vw !important;height:17.852vh !important;max-width:100% !important;box-sizing:border-box !important;}
html > body > header.tpl-nav > div.tpl-nav-inner > a.tpl-nav-cta:nth-of-type(2){border-radius:99px 99px 99px 99px !important;}
</style>


</body>
</html>
