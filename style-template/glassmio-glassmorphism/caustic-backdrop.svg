<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <!-- Glassmio 玻璃拟态 · 流光冰蓝 —— 环境光焦散层（原页内联 SVG 原样抽出）
       素材：左下奶油 / 象牙光丝带 + 右上 45° 冰蓝光束 ×4 + 长春花紫阴影袋 ×2
       模糊：feGaussianBlur 26（光束）/ 38（丝带）。background.css 用纯 CSS 渐变近似这层光焦，
       想要像素级效果就把本文件复制到项目 assets/ 并按 background.css 末尾的替换写法引用。 -->
  <defs>
    <linearGradient id="creamArc" x1="15%" y1="0%" x2="48%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="48%" stop-color="#FFFDF9" stop-opacity="0.94"/>
      <stop offset="82%" stop-color="#FAF3EE" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#F5ECE9" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="warmSilk" x1="0%" y1="25%" x2="45%" y2="95%">
      <stop offset="0%" stop-color="#FFF9F4" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#F7ECE8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#E5E6FA" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="skyBright" x1="100%" y1="0%" x2="25%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#E8F5FF" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#BCE0FF" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#C8DCFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skySoft" x1="95%" y1="0%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#F2F9FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#C4E3FF" stop-opacity="0.68"/>
      <stop offset="85%" stop-color="#B9D5FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D5E0FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lavenderPocket" cx="16%" cy="84%" r="48%">
      <stop offset="0%" stop-color="#D4D7F5" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#DFE3F9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E9EDFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="upperFold" cx="46%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#C5D2FA" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#D4DDFB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E4EAFC" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurLg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="blurMd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 基础大气：长春花紫折角 + 左下紫色阴影袋 -->
  <rect width="1440" height="900" fill="url(#upperFold)"/>
  <rect width="1440" height="900" fill="url(#lavenderPocket)"/>

  <!-- 右上 45° 平行冰蓝 / 冷白光束 -->
  <g filter="url(#blurMd)">
    <polygon points="860,-60 1050,-60 680,260 560,180" fill="url(#skyBright)"/>
    <polygon points="1090,-60 1290,-60 760,390 630,300" fill="url(#skyBright)"/>
    <polygon points="1330,-40 1510,60 850,590 710,490" fill="url(#skySoft)"/>
    <polygon points="1480,190 1540,390 980,820 860,710" fill="url(#skySoft)" opacity="0.8"/>
  </g>

  <!-- 左上方扫向左下的奶油 / 象牙丝带 -->
  <g filter="url(#blurLg)">
    <path d="M -80,310 C 120,420 260,640 430,960 L 640,960 C 440,630 260,400 -80,220 Z" fill="url(#warmSilk)"/>
    <path d="M 190,-60 C 235,280 330,610 560,960 L 810,960 C 530,610 385,280 340,-60 Z" fill="url(#creamArc)"/>
  </g>
</svg>
